spring:
  datasource:
    url: jdbc:h2:mem:studytracker_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    cookie:
      secure: false
  demo-account:
    enabled: true
    password: TestEnvSecurePassword!123

ai:
  enabled: true
  provider: mock
  daily-request-limit: 100
  timeout-seconds: 5
