server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: studytracker-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studytracker}}
    username: ${DB_USER:studytracker}
    password: ${DB_PASSWORD:studytracker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Security & JWT
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000
  demo-account:
    enabled: ${DEMO_ACCOUNT_ENABLED:true}
    name: Jayasuriya
    username: jayasuriya
    email: jayasuriya@example.com
    password: password123
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# AI Assistant
ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:mock}
  base-url: ${AI_BASE_URL:http://localhost:11434}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:llama3.2}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  daily-request-limit: ${AI_DAILY_REQUEST_LIMIT:100}
  max-input-characters: ${AI_MAX_INPUT_CHARACTERS:4000}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1000}

# OpenAPI Doc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
