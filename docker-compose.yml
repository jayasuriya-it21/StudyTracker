services:
  postgres:
    image: postgres:16-alpine
    container_name: studytracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studytracker}
      POSTGRES_USER: ${POSTGRES_USER:-studyuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studypassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyuser} -d ${POSTGRES_DB:-studytracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - studytracker-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studytracker-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-studytracker}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-studyuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-studypassword}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeywithatleast256bitsofentropyforsecurity!}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-MOCK}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - studytracker-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studytracker-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - studytracker-network

  # Optional local Ollama LLM provider (run with: docker compose --profile ollama up)
  ollama:
    image: ollama/ollama:latest
    container_name: studytracker-ollama
    restart: unless-stopped
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - studytracker-network

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local

networks:
  studytracker-network:
    driver: bridge
